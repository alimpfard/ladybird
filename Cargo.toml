[workspace]
members = [
    "AK/Rust",
    "Libraries/LibGfx/Rust",
    "Libraries/LibImageDecoders/Rust",
    "Libraries/LibIPC/Rust",
    "Libraries/LibJS/Rust",
    "Libraries/LibRegex/Rust",
    "Libraries/LibTextCodec/Rust",
    "Libraries/LibUnicode/Rust",
    "Libraries/LibURL/Rust",
    "Libraries/LibWasm/Rust",
    "Libraries/LibWeb/ContentBlocker/Rust",
    "Libraries/LibWeb/Rust",
    "Libraries/LibWeb/HTML/Parser/Rust",
    # Per-endpoint crates emitted by Meta/Generators/generate_ipc_definitions.py
    # via the cmake `compile_ipc` function. The glob requires at least one match,
    # so a `cmake` configure must have run for any build directory before cargo
    # is invoked at the workspace root.
    "Build/*/cargo/generated/ipc/*",
]
exclude = [
    "Libraries/LibJS/Flap",
]
resolver = "2"

[workspace.dependencies]
libipc = { path = "Libraries/LibIPC/Rust" }

[profile.release]
panic = "abort"

[profile.distribution]
inherits = "release"
incremental = false
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = "deny" # includes lintgroups: correctness, suspicious, style, complexity, perf
# from clippy:nursery:
redundant_clone = "deny"
# from clippy:pedantic:
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else = "deny"
unnecessary_wraps = "deny"
manual_assert = "deny"
ref_option = "deny"
elidable_lifetime_names = "deny"
unnested_or_patterns = "deny"
borrow_as_ptr = "deny"
explicit_iter_loop = "deny"
