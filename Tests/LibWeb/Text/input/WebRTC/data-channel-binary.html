<!DOCTYPE html>
<script src="../include.js"></script>
<script src="peer-test.js"></script>
<script>
rtcTest(async () => {
    const pair = peerPair();
    try {
        const [local, remote] = await dataPair(pair);
        for (const [name, payload, expected] of [
            ["ArrayBuffer", new Uint8Array([0, 255, 128, 1]).buffer, [0, 255, 128, 1]],
            ["typed array slice", new Uint8Array([99, 4, 5, 88]).subarray(1, 3), [4, 5]],
            ["DataView slice", new DataView(new Uint8Array([99, 6, 7, 88]).buffer, 1, 2), [6, 7]],
            ["Blob", new Blob([new Uint8Array([0, 17, 255])]), [0, 17, 255]],
        ]) {
            const received = nextEvent(remote, "message");
            local.send(payload);
            const actual = await bytes((await received).data);
            check(actual.length === expected.length && actual.every((value, index) => value === expected[index]), `${name} preserves exactly its bytes`);
        }
        pair.checkICE();
    } finally {
        pair.close();
    }
});
</script>
